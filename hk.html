6.1, 51.59, 48.64, 42.25, 37.07, 31.72, 35.44, 30.45, 34.69, 28.9, 31.92, 30.72, 16.47, 24.81, 27.99, 30.63, 24.4, 39.03, 35.89, 29.76, 32.53, 24.66, 39.37, 34.53, 39.79, 41.09, 16.67, 34.14, 33.73, 43.39, 47.97, 77.76, 37.99, 37.82, 32.83, 66.52, 79.58, 78.21, 78.24, 29.25, 32.74]}];
const W = 760, H = 240;
const PAD_L = 44, PAD_R = 54, PAD_T = 16, PAD_B = 22;
const IW = W - PAD_L - PAD_R, IH = H - PAD_T - PAD_B;
const NS = "http://www.w3.org/2000/svg";

function el(tag, attrs) {
  const n = document.createElementNS(NS, tag);
  for (const k in attrs) n.setAttribute(k, attrs[k]);
  return n;
}

function buildChart(item, idx) {
  const card = document.createElement("div");
  card.className = "card";
  const last = item.values.length - 1;
  const hd = document.createElement("div");
  hd.className = "hd";
  hd.innerHTML = '<span class="nm">' + item.label + '</span>'
    + '<span class="cur">' + item.values[last].toFixed(1) + '%</span>';
  card.appendChild(hd);
  const readout = document.createElement("div");
  readout.className = "readout";
  readout.textContent = "　";
  card.appendChild(readout);

  const svg = el("svg", {viewBox: "0 0 " + W + " " + H,
                         preserveAspectRatio: "xMidYMid meet"});
  // 鼠标层
  const hit = el("rect", {x: PAD_L, y: PAD_T, width: IW, height: IH,
                           fill: "transparent"});
  const gGrid = el("g", {});
  const path = el("path", {fill: "none", stroke: "#0a84ff", "stroke-width": 1.8});
  const dot = el("circle", {r: 3.2, fill: "#ff9f0a"});
  const vx = el("line", {stroke: "#8e8e93", "stroke-width": 1,
                          "stroke-dasharray": "3 3", opacity: 0});
  const hy = el("line", {stroke: "#8e8e93", "stroke-width": 1,
                          "stroke-dasharray": "3 3", opacity: 0});
  const pinDot = el("circle", {r: 4, fill: "none", stroke: "#ff3b30",
                                "stroke-width": 2, opacity: 0});
  const yTxt = el("text", {"font-size": 10, fill: "#8e8e93",
                            "text-anchor": "start", opacity: 0});
  const xTxt = el("text", {"font-size": 10, fill: "#8e8e93",
                            "text-anchor": "middle", opacity: 0});

  const vals = item.values;
  const lo = Math.min(...vals), hi = Math.max(...vals);
  const span = (hi - lo) || 1;
  const y0 = lo - span * 0.14, y1 = hi + span * 0.14;
  const X = i => PAD_L + IW * i / (vals.length - 1);
  const Y = v => PAD_T + IH * (1 - (v - y0) / (y1 - y0));

  // 网格与 y 轴刻度
  [0, 0.25, 0.5, 0.75, 1].forEach(f => {
    const v = y0 + (y1 - y0) * (1 - f);
    const yy = PAD_T + IH * f;
    gGrid.appendChild(el("line", {x1: PAD_L, y1: yy, x2: PAD_L + IW, y2: yy,
                                   stroke: "#eef0f2", "stroke-width": 1}));
    const t = el("text", {x: PAD_L - 5, y: yy + 3, "font-size": 9,
                           fill: "#b0b0b5", "text-anchor": "end"});
    t.textContent = v.toFixed(0);
    gGrid.appendChild(t);
  });
  // x 轴首尾日期
  [0, vals.length - 1].forEach((i, k) => {
    const t = el("text", {x: X(i), y: H - 5, "font-size": 9, fill: "#b0b0b5",
                           "text-anchor": k === 0 ? "start" : "end"});
    t.textContent = item.dates[i];
    gGrid.appendChild(t);
  });

  let d = "";
  vals.forEach((v, i) => { d += (i ? "L" : "M") + X(i).toFixed(1) + "," + Y(v).toFixed(1); });
  path.setAttribute("d", d);
  // ⚠ 这里是 `vals[last]` 而不是 `last`：`Y()` 的入参是**数值**，`last` 是索引。
  // 传索引不会报错，只会把点画到很远的地方（实测 cy=-1007，整点跑到图外），
  // 图上"看起来只是没有那个橙点" —— 典型的静默错位。
  dot.setAttribute("cx", X(last)); dot.setAttribute("cy", Y(vals[last]));

  svg.appendChild(gGrid); svg.appendChild(path);
  svg.appendChild(vx); svg.appendChild(hy);
  svg.appendChild(dot); svg.appendChild(pinDot);
  svg.appendChild(yTxt); svg.appendChild(xTxt); svg.appendChild(hit);
  card.appendChild(svg);

  let pinned = -1;

  function show(i) {
    const v = vals[i];
    vx.setAttribute("x1", X(i)); vx.setAttribute("x2", X(i));
    vx.setAttribute("y1", PAD_T); vx.setAttribute("y2", PAD_T + IH);
    hy.setAttribute("x1", PAD_L); hy.setAttribute("x2", PAD_L + IW);
    hy.setAttribute("y1", Y(v)); hy.setAttribute("y2", Y(v));
    [vx, hy, yTxt, xTxt].forEach(n => n.setAttribute("opacity", 1));
    yTxt.setAttribute("x", PAD_L + IW + 6); yTxt.setAttribute("y", Y(v) + 3);
    yTxt.textContent = v.toFixed(1) + "%";
    xTxt.setAttribute("x", X(i)); xTxt.setAttribute("y", PAD_T + IH + 14);
    xTxt.textContent = item.dates[i];
    readout.innerHTML = '<b>' + item.dates[i] + '</b>　' + item.label
      + ' = <b>' + v.toFixed(2) + '%</b>';
  }
  function hide() {
    if (pinned >= 0) return;
    [vx, hy, yTxt, xTxt].forEach(n => n.setAttribute("opacity", 0));
    readout.textContent = "　";
  }

  function idxFromEvent(ev) {
    const r = svg.getBoundingClientRect();
    const cx = (ev.clientX - r.left) / r.width * W;
    const t = (cx - PAD_L) / IW * (vals.length - 1);
    return Math.max(0, Math.min(vals.length - 1, Math.round(t)));
  }
  hit.addEventListener("mousemove", ev => { if (pinned < 0) show(idxFromEvent(ev)); });
  hit.addEventListener("mouseleave", hide);
  hit.addEventListener("click", ev => {
    const i = idxFromEvent(ev);
    if (pinned === i) {          // 再点同一点：解除锁定
      pinned = -1; pinDot.setAttribute("opacity", 0); hide();
    } else {
      pinned = i; show(i);
      pinDot.setAttribute("cx", X(i));
      pinDot.setAttribute("cy", Y(vals[i]));
      pinDot.setAttribute("opacity", 1);
    }
  });
  return card;
}

const grid = document.getElementById("grid");
DATA.forEach((it, i) => grid.appendChild(buildChart(it, i)));
</script>
